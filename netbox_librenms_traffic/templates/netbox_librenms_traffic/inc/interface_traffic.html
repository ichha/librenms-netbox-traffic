{% load static %}
<div class="card mt-4 librenms-traffic-card" id="librenms-traffic-card">
    <div class="card-header d-flex justify-content-between align-items-center bg-body-tertiary border-bottom py-2">
        <h5 class="card-title mb-0 d-flex align-items-center gap-2">
            <span class="librenms-badge-icon"></span>
            LibreNMS Interface Traffic
        </h5>
        <div class="btn-group btn-group-sm" role="group" aria-label="LibreNMS Time Range">
            <button type="button" class="btn btn-outline-secondary active btn-range" data-range="1d">Last 24 Hours</button>
            <button type="button" class="btn btn-outline-secondary btn-range" data-range="2d">Last 48 Hours</button>
            <button type="button" class="btn btn-outline-secondary btn-range" data-range="7d">Last 7 Days</button>
            <button type="button" class="btn btn-outline-secondary btn-range" data-range="30d">Last 30 Days</button>
            <button type="button" class="btn btn-outline-secondary btn-range" data-range="1y">Last 1 Year</button>
        </div>
    </div>
    <div class="card-body position-relative p-1">
        
        <!-- Loading Spinner -->
        <div id="librenms-loading" class="d-flex flex-column justify-content-center align-items-center py-5">
            <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <span class="mt-3 text-muted fw-semibold">Querying LibreNMS for interface graph...</span>
        </div>

        <!-- Error Alert -->
        <div id="librenms-error" class="alert alert-warning d-none" role="alert">
            <h5 class="alert-heading fw-bold d-flex align-items-center gap-2">
                <i class="mdi mdi-alert-circle"></i> LibreNMS Mapping Warning
            </h5>
            <p id="librenms-error-msg" class="mb-0"></p>
        </div>

        <!-- Graph Image Container -->
        <div id="librenms-graph-wrapper" class="d-none text-center">
            <img id="librenms-graph-img" src="" alt="LibreNMS Traffic Graph" class="img-fluid" style="width: 100%; height: auto;" />
        </div>

    </div>
</div>

<!-- Load Custom CSS and JS -->
<link rel="stylesheet" href="{% static 'netbox_librenms_traffic/css/traffic.css' %}">
<script src="{% static 'netbox_librenms_traffic/js/traffic.js' %}" 
        data-device="{{ device_name }}" 
        data-interface="{{ interface_name }}"></script>
